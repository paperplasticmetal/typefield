name: macOS build
on:
  push:
    branches: [main]
    paths-ignore:
      - 'marketing/**'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - 'marketing/**'
      - 'docs/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: xcodebuild -version
      - name: Build and regression checks
        run: ./build.sh
      - name: Verify local signature
        run: codesign --verify --deep --strict dist/Typefield.app
      - name: Figma importer contract tests
        run: node tests/figma-import.test.js
      - name: Signed updater feed regression checks
        run: python3 scripts/updater/test-appcast.py
      - name: Public beta download matches app version
        run: python3 scripts/check-beta-website.py
      - name: Archive Store target without distribution signing
        if: github.event_name == 'workflow_dispatch'
        run: >-
          xcodebuild -project Typefield.xcodeproj -scheme Typefield
          -configuration Release -derivedDataPath .build/xcode
          -destination 'generic/platform=macOS' -archivePath dist/Typefield.xcarchive
          CODE_SIGNING_ALLOWED=NO archive
